<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTS Pem Web - Biodata Anggota</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS persis sesuai contoh UTS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-white d-flex flex-column min-vh-100">

  <!-- ================= TOP NAVBAR ================= -->
  <!-- Persis sesuai gambar referensi: UTS Pem Web, Home, Features, (Masukkan Nama), (Masukkan NIM) -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white pt-3 pb-2">
    <div class="container-fluid px-4 px-lg-5">
      
      <!-- Brand Logo / Title -->
      <a class="navbar-brand text-dark fw-normal fs-5 me-4" href="#home">UTS Pem Web</a>

      <!-- Hamburger Button (Mobile Responsive Toggler) -->
      <button 
        class="navbar-toggler border-0 shadow-none p-1" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#navMenu" 
        aria-controls="navMenu" 
        aria-expanded="false" 
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar Links -->
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-3">
          <li class="nav-item">
            <a class="nav-link text-secondary active px-0" aria-current="page" href="#home">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-secondary px-0" href="#features">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-secondary px-0" href="#" id="navNama" title="Klik untuk ganti teks">(Masukkan Nama)</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-secondary px-0" href="#" id="navNim" title="Klik untuk ganti teks">(Masukkan NIM)</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- ================= MAIN CONTENT CONTAINER ================= -->
  <main class="flex-grow-1 py-3">
    <div class="container-fluid px-4 px-lg-5" style="max-width: 1140px;">
      
      <!-- Alert Banner: "Biodata berhasil diperbarui." -->
      <div id="alertBanner" class="alert alert-success alert-dismissible fade show border-0 d-flex justify-content-between align-items-center mb-4 py-2 px-3 rounded-2" role="alert">
        <span id="alertMessage" class="small fw-normal">Biodata berhasil diperbarui.</span>
        <button type="button" class="btn-close shadow-none p-2" data-bs-dismiss="alert" aria-label="Close" style="font-size: 11px;"></button>
      </div>

      <!-- Card Grid: 3 Kolom Sesuai Gambar Referensi -->
      <div class="row row-cols-1 row-cols-md-3 g-4" id="memberCardGrid">
        
        <!-- CARD 1: Tombol Tambah Anggota (+) -->
        <div class="col" id="colAddCard">
          <div class="card h-100 border rounded-3 bg-white d-flex align-items-center justify-content-center p-4 card-add-member" style="min-height: 480px;">
            <button 
              type="button" 
              class="btn-plus-circle d-flex align-items-center justify-content-center shadow-sm"
              data-bs-toggle="modal" 
              data-bs-target="#modalAddMember"
              title="Tambah Anggota Biodata Baru"
            >
              <i class="bi bi-plus text-white"></i>
            </button>
          </div>
        </div>

        <!-- CARD 2 & CARD 3 DILENGKAPI DINAMIS DARI DATABASE / REST API -->
        <!-- Template kartu akan di-render oleh script.js -->

      </div>

    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <!-- Persis sesuai gambar referensi: Links di atas, garis pemisah, dan teks copyright di bawah -->
  <footer class="mt-auto py-4 bg-white text-center">
    <div class="container-fluid px-4 px-lg-5" style="max-width: 1140px;">
      
      <!-- Footer Nav Links -->
      <div class="d-flex justify-content-center flex-wrap gap-4 mb-3 small text-secondary">
        <a href="#home" class="text-secondary text-decoration-none">Home</a>
        <a href="#features" class="text-secondary text-decoration-none">Features</a>
        <a href="#pricing" class="text-secondary text-decoration-none">Pricing</a>
        <a href="#faqs" class="text-secondary text-decoration-none">FAQs</a>
        <a href="#about" class="text-secondary text-decoration-none">About</a>
      </div>

      <!-- Divider line -->
      <hr class="my-4 text-muted opacity-25">

      <!-- Copyright Statement -->
      <p class="small text-muted mb-0" id="footerCopyright">
        &copy; 2025 Dibuat Sejujurnya Oleh Team (Muhammad Ryan Rizki) dan (Lalu Revian Firdaus) Tanpa Mencotek dari Tim Lain
      </p>

    </div>
  </footer>

  <!-- ================= MODAL TAMBAH BIODATA ANGGOTA ================= -->
  <div class="modal fade" id="modalAddMember" tabindex="-1" aria-labelledby="modalAddMemberLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 border-0 shadow">
        
        <div class="modal-header border-bottom py-3 px-4">
          <h5 class="modal-title fs-6 fw-bold" id="modalAddMemberLabel">Tambah Biodata Anggota</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="formAddMember">
          <div class="modal-body p-4 space-y-3">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Nama Lengkap</label>
              <input type="text" class="form-control" name="name" required placeholder="Contoh: andi agus salim">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">NIM</label>
              <input type="text" class="form-control" name="nim" required placeholder="Contoh: 12.11.6018">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Deskripsi &amp; Tugas UTS</label>
              <textarea class="form-control" name="description" rows="3" required placeholder="Contoh: dengan NIM 12.11.6018 merupakan pegawai dan mempunyai tugas mengerjakan back-end pada UTS ini"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Pilih Foto Anggota</label>
              <select class="form-select" name="photoSelect" id="photoSelect">
                <option value="img/lalu.jpg">Foto Lalu Revian Firdaus</option>
                <option value="img/ryan.jpg">Foto Muhammad Ryan Rizki</option>
                <option value="img/default-avatar.svg" selected>Avatar Default</option>
              </select>
            </div>
          </div>

          <div class="modal-footer border-top px-4 py-2">
            <button type="button" class="btn btn-sm btn-light border px-3" data-bs-dismiss="modal">Batal</button>
            <button type="submit" id="btnSubmitAdd" class="btn btn-sm btn-primary px-3">Simpan Biodata</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- ================= MODAL EDIT BIODATA ANGGOTA ================= -->
  <div class="modal fade" id="modalEditMember" tabindex="-1" aria-labelledby="modalEditMemberLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-3 border-0 shadow">
        
        <div class="modal-header border-bottom py-3 px-4">
          <h5 class="modal-title fs-6 fw-bold" id="modalEditMemberLabel">Edit Biodata Anggota</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="formEditMember">
          <input type="hidden" name="id" id="editMemberId">
          <div class="modal-body p-4 space-y-3">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Nama Lengkap</label>
              <input type="text" class="form-control" name="name" id="editName" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">NIM</label>
              <input type="text" class="form-control" name="nim" id="editNim" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Deskripsi &amp; Tugas UTS</label>
              <textarea class="form-control" name="description" id="editDescription" rows="3" required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-secondary">Pilih Foto</label>
              <select class="form-select" name="photo" id="editPhoto">
                <option value="img/lalu.jpg">Foto Lalu Revian Firdaus</option>
                <option value="img/ryan.jpg">Foto Muhammad Ryan Rizki</option>
                <option value="img/default-avatar.svg">Avatar Default</option>
              </select>
            </div>
          </div>

          <div class="modal-footer border-top px-4 py-2">
            <button type="button" class="btn btn-sm btn-light border px-3" data-bs-dismiss="modal">Batal</button>
            <button type="submit" id="btnSubmitEdit" class="btn btn-sm btn-primary px-3">Perbarui Biodata</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Custom JS -->
  <script src="js/script.js"></script>
</body>
</html>
